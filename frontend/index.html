<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags & SEO -->
    <title>RealmFlow — Modern Project &amp; Task Management</title>
    <meta
      name="title"
      content="RealmFlow — Modern Project & Task Management"
    />
    <meta
      name="description"
      content="Plan projects, organize sprints, track tasks, and collaborate seamlessly across workspaces with RealmFlow — a fast, modern project and task management platform."
    />
    <meta
      name="keywords"
      content="RealmFlow, project management, task management, kanban board, sprint planning, team collaboration, workflow tracker, workspace management"
    />
    <meta name="author" content="RealmFlow" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="RealmFlow" />

    <!-- Theme Color for Light & Dark Browser Chrome -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#09090b"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RealmFlow" />
    <meta
      property="og:title"
      content="RealmFlow — Modern Project & Task Management"
    />
    <meta
      property="og:description"
      content="Plan projects, track tasks, and ship work on time with clean boards, priorities, and team workspaces."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="RealmFlow — Modern Project & Task Management"
    />
    <meta
      name="twitter:description"
      content="Plan projects, track tasks, and ship work on time with clean boards, priorities, and team workspaces."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "RealmFlow",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Modern project and task management application for organizing workspaces, sprints, and team workflows.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
